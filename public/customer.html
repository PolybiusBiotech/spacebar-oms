<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Polybius Biotech — Transaction Status</title>
    <style>
      @font-face {
        font-family: 'PermanentMarker';
        src: url('/fonts/permanent-marker.woff2') format('woff2');
        font-weight: 400;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Eurostile', ui-sans-serif, system-ui, sans-serif;
        /* phosphor glow — slight bright centre like a real CRT tube */
        background: radial-gradient(ellipse 80% 70% at 50% 40%, #001a00 0%, #000F00 100%);
        color: #7CC142;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* CRT: scanlines + vignette in one element */
      .crt-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9999;
        background:
          radial-gradient(ellipse 85% 85% at 50% 50%, transparent 45%, rgba(0,0,0,0.65) 100%),
          repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 3px,
            rgba(0,0,0,0.13) 3px,
            rgba(0,0,0,0.13) 4px
          );
      }

      header {
        padding: 0.6rem 1.5rem 0.5rem;
        border-bottom: 1px solid rgba(124,193,66,0.15);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 0.4em;
        white-space: nowrap;
        overflow: hidden;
      }

      .header-dim {
        font-size: clamp(0.45rem, 1.1vw, 0.6rem);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(124,193,66,0.38);
        vertical-align: middle;
      }

      .header-graffiti {
        font-family: 'PermanentMarker', cursive;
        font-weight: 400;
        font-size: clamp(0.8rem, 2vw, 1.1rem);
        text-transform: none;
        color: #FCA311;
        display: inline-block;
        transform: rotate(-3deg) translateY(-1px);
        filter: url(#spray-paint) drop-shadow(0 0 10px rgba(252,163,17,0.65)) drop-shadow(0 0 24px rgba(252,163,17,0.25));
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0;
        flex: 1;
        min-height: 0;
      }

      .col {
        display: flex;
        flex-direction: column;
        border-right: 1px solid rgba(124,193,66,0.1);
        overflow: hidden;
      }
      .col:last-child { border-right: none; }

      .col h2 {
        font-size: clamp(0.55rem, 1.3vw, 0.7rem);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        padding: 1rem 1.25rem 0.75rem;
        border-bottom: 1px solid rgba(124,193,66,0.12);
        flex-shrink: 0;
      }

      .col--pending  h2 { color: rgba(124,193,66,0.35); }
      .col--paying   h2 { color: rgba(252,163,17,0.6); }
      .col--collect  h2 { color: rgba(124,193,66,0.85); }

      .col > div {
        flex: 1;
        overflow-y: auto;
        padding: 0.75rem 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .order-name {
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1.1;
      }

      .col--pending  .order-name { color: rgba(124,193,66,0.28); }
      .col--paying   .order-name { color: #FCA311; }
      .col--collect  .order-name { color: #7CC142; text-shadow: 0 0 20px rgba(124,193,66,0.28); }

      .order-name + .order-name {
        border-top: 1px solid rgba(124,193,66,0.08);
        padding-top: 0.5rem;
        margin-top: 0.25rem;
      }

      /* poly claw watermark */
      .board-claw {
        position: fixed;
        bottom: 1.25rem;
        right: 1.5rem;
        width: 90px;
        opacity: 0.45;
        pointer-events: none;
        filter: brightness(0) invert(1);
      }

      /* glitch keyframes — H (horizontal) */
      @keyframes board-glitch-h {
        0%   { transform: translate(0,0) skewX(0); filter: none; opacity: 1; }
        8%   { transform: translate(-20px,0) skewX(-4deg); filter: drop-shadow(8px 0 0 rgba(255,0,128,0.9)) drop-shadow(-8px 0 0 rgba(0,220,255,0.9)); }
        18%  { transform: translate(16px,0) skewX(3deg);  filter: drop-shadow(-7px 0 0 rgba(255,0,128,0.8)) drop-shadow(7px 0 0 rgba(0,220,255,0.8)); }
        26%  { transform: translate(0,0) skewX(0); filter: none; }
        58%  { opacity: 1; }
        61%  { opacity: 0; transform: translate(14px,0) skewX(-2deg); filter: drop-shadow(-7px 0 0 rgba(0,220,255,0.85)); }
        65%  { opacity: 1; transform: translate(0,0); filter: none; }
        69%  { opacity: 0; transform: translate(-8px,0); }
        73%  { opacity: 1; transform: translate(0,0); }
        100% { transform: translate(0,0) skewX(0); filter: none; opacity: 1; }
      }

      /* glitch keyframes — V (vertical) */
      @keyframes board-glitch-v {
        0%   { transform: translate(0,0) scaleY(1); filter: none; opacity: 1; }
        10%  { transform: translate(0,-12px) scaleY(1.03); filter: drop-shadow(0 6px 0 rgba(255,0,128,0.3)) drop-shadow(0 -6px 0 rgba(0,220,255,0.3)); }
        20%  { transform: translate(0,8px) scaleY(0.98); filter: none; }
        30%  { transform: translate(0,0) scaleY(1); }
        65%  { opacity: 0.2; transform: translate(0,10px); }
        69%  { opacity: 1;   transform: translate(0,0); }
        85%  { opacity: 0;   transform: translate(0,-4px); }
        89%  { opacity: 1;   transform: translate(0,0); }
        100% { transform: translate(0,0) scaleY(1); filter: none; opacity: 1; }
      }

      .board.glitching-h { animation: board-glitch-h 0.55s linear forwards; }
      .board.glitching-v { animation: board-glitch-v 0.55s linear forwards; }
    </style>
  </head>
  <body>
    <div class="crt-overlay" aria-hidden="true"></div>
    <header>
      <span class="header-dim">Polybius Biotech Galactic Trade Network //</span><span class="header-graffiti">space</span><span class="header-dim">Base Asset Retrieval System // Transaction Status</span>
    </header>
    <div class="board" id="board">
      <div class="col col--pending">
        <h2>Proceed to payment</h2>
        <div id="pending"></div>
      </div>
      <div class="col col--paying">
        <h2>Asset retrieval in progress</h2>
        <div id="paying"></div>
      </div>
      <div class="col col--collect">
        <h2>Ready to collect</h2>
        <div id="collect"></div>
      </div>
    </div>
    <img class="board-claw" src="/poly-claw.png" alt="">
    <script src="/customer.js"></script>
    <script>
      (function () {
        const board = document.getElementById('board');
        function scheduleGlitch() {
          setTimeout(fireGlitch, 3_000 + Math.random() * 10_000);
        }
        function fireGlitch() {
          const cls = Math.random() > 0.5 ? 'glitching-h' : 'glitching-v';
          board.classList.add(cls);
          setTimeout(() => { board.classList.remove(cls); scheduleGlitch(); }, 550);
        }
        scheduleGlitch();
      })();
    </script>
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
      <defs>
        <filter id="spray-paint" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="7" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>
  </body>
</html>
