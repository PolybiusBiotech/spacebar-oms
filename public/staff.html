<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Space Bar — Staff</title>
    <!-- TODO LUKE: styles -->
    <style>
      /* bare-bones layout — replace entirely */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: sans-serif; background: #111; color: #eee; padding: 1rem; }
      .printer-alert { background: #800; color: #fff; padding: 0.75rem 1rem; margin-bottom: 1rem; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
      .printer-alert button { background: #fff; color: #800; border: none; padding: 0.25rem 0.75rem; cursor: pointer; border-radius: 3px; }
      .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
      .col h2 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.1em; border-bottom: 1px solid #444; padding-bottom: 0.5rem; margin-bottom: 0.75rem; }
      .order { border: 1px solid #333; border-radius: 4px; padding: 0.75rem; margin-bottom: 0.75rem; }
      .order-name { font-size: 1.4rem; font-weight: bold; margin-bottom: 0.25rem; }
      .order-total { color: #aaa; font-size: 0.9rem; margin-bottom: 0.5rem; }
      .order-lines { font-size: 0.85rem; color: #bbb; margin-bottom: 0.75rem; }
      .order-lines li { margin-left: 1rem; }
      .collect-btn { background: #060; color: #fff; border: none; padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; border-radius: 3px; width: 100%; }
      .collect-btn:disabled { opacity: 0.5; }
      .order--collect { border-color: #060; opacity: 0.6; }
      .order--collect .order-name { color: #0a0; }
      .error-banner { background: #500; color: #fff; padding: 0.5rem 1rem; margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <div id="alerts"></div>
    <div id="error"></div>
    <div class="board">
      <div class="col">
        <h2>Ordering</h2>
        <div id="pending"></div>
      </div>
      <div class="col">
        <h2>Paying</h2>
        <div id="paying"></div>
      </div>
      <div class="col">
        <h2>Collect</h2>
        <div id="collect"></div>
      </div>
    </div>
    <script src="/staff.js"></script>
  </body>
</html>
