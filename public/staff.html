<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Space Bar — Staff</title>
    <!-- TODO LUKE: styles -->
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: sans-serif; background: #111; color: #eee; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
      #alerts, #error { flex-shrink: 0; padding: 0 1rem; }
      .printer-alert { background: #800; color: #fff; padding: 0.75rem 1rem; margin-top: 0.5rem; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
      .printer-alert button { background: #fff; color: #800; border: none; padding: 0.25rem 0.75rem; cursor: pointer; border-radius: 3px; }
      .board { display: grid; grid-template-columns: repeat(3, 1fr); flex: 1; min-height: 0; }
      .col { display: flex; flex-direction: column; min-height: 0; border-right: 2px solid #2a2a2a; }
      .col:last-child { border-right: none; }
      .col-header { font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; padding: 0.75rem 1rem; border-bottom: 2px solid #2a2a2a; flex-shrink: 0; }
      .col--unpaid  .col-header { color: #aaa; border-bottom-color: #444; }
      .col--paying  .col-header { color: #fc0; border-bottom-color: #554400; }
      .col--collect .col-header { color: #4d4; border-bottom-color: #1a4d1a; }
      .col-body { overflow-y: auto; flex: 1; padding: 0.75rem; }
      .order { border: 1px solid #2c2c2c; border-radius: 6px; padding: 0.85rem; margin-bottom: 0.6rem; }
      .order-name { font-size: 1.5rem; font-weight: bold; margin-bottom: 0.1rem; }
      .order-total { color: #666; font-size: 0.85rem; margin-bottom: 0.6rem; }
      .order-lines { margin-bottom: 0.85rem; display: flex; flex-direction: column; gap: 0.3rem; }
      .order-line { display: flex; align-items: baseline; gap: 0.5rem; }
      .order-line-qty { font-size: 1rem; font-weight: 700; color: #fc0; min-width: 2.2ch; flex-shrink: 0; }
      .order-line-desc { font-size: 1.1rem; color: #eee; line-height: 1.25; }
      .collect-btn { background: #060; color: #fff; border: none; padding: 0.9rem 1rem; font-size: 1.15rem; font-weight: 700; cursor: pointer; border-radius: 5px; width: 100%; }
      .collect-btn:hover { background: #080; }
      .collect-btn:disabled { opacity: 0.5; cursor: default; }
      .order--collect { border-color: #1a4d1a; opacity: 0.6; }
      .order--collect .order-name { color: #4d4; }
      .order--collect .order-hatch { color: #4d4; font-size: 0.9rem; font-weight: 700; margin-top: 0.15rem; }
      .error-banner { background: #500; color: #fff; padding: 0.5rem 1rem; margin-top: 0.5rem; }
      .hatch-picker { margin-top: 0.5rem; }
      .hatch-picker-label { font-size: 0.85rem; color: #aaa; margin-bottom: 0.5rem; }
      .hatch-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
      .hatch-btn { background: #1a1a1a; border: 1px solid #444; border-radius: 5px; color: #eee; font-size: 1.4rem; font-weight: 700; padding: 0.75rem 0; cursor: pointer; line-height: 1.2; }
      .hatch-btn:hover { background: #2a4a2a; border-color: #060; }
      .hatch-btn--occupied { background: #1a0a00; border-color: #663300; color: #cc7733; font-size: 0.95rem; font-weight: 400; }
      .hatch-btn--occupied:hover { background: #2a1500; border-color: #884400; }
      .hatch-cancel { margin-top: 0.4rem; width: 100%; background: none; border: 1px solid #333; border-radius: 5px; color: #666; font-size: 1rem; padding: 0.6rem; cursor: pointer; }
      .hatch-cancel:hover { color: #aaa; border-color: #555; }
    </style>
  </head>
  <body>
    <div id="alerts"></div>
    <div id="error"></div>
    <div class="board">
      <div class="col col--unpaid">
        <div class="col-header">Unpaid</div>
        <div class="col-body" id="pending"></div>
      </div>
      <div class="col col--paying">
        <div class="col-header">Paid</div>
        <div class="col-body" id="paying"></div>
      </div>
      <div class="col col--collect">
        <div class="col-header">Collect</div>
        <div class="col-body" id="collect"></div>
      </div>
    </div>
    <script src="/staff.js"></script>
  </body>
</html>
