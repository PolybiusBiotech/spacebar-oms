<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Collection Point — Space Bar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Eurostile', ui-sans-serif, system-ui, sans-serif;
      background: #000F00;
      color: #7CC142;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background-color 0.3s;
    }

    @keyframes screen-pulse {
      0%, 100% { background-color: #050800; }
      50%       { background-color: #3a1800; }
    }

    body.has-order {
      animation: screen-pulse 2s ease-in-out 0.3s infinite;
    }

    .crt-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.15) 3px, rgba(0,0,0,0.15) 4px
      );
    }

    .cp-label {
      font-size: clamp(0.7rem, 4vw, 1rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(124,193,66,0.4);
      margin-bottom: 0.5em;
    }


    .order-section {
      margin-top: 2rem;
      text-align: center;
    }

    .order-name {
      font-size: clamp(4rem, 22vw, 10rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #FCA311;
      text-shadow: 0 0 24px rgba(252,163,17,0.35);
      animation: order-arrive 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes order-arrive {
      from { transform: scale(0.85); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .order-sub {
      font-size: clamp(0.7rem, 3vw, 1rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(252,163,17,0.5);
      margin-top: 0.4em;
    }

    .empty {
      font-size: clamp(0.7rem, 3vw, 1rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(124,193,66,0.2);
    }

    @keyframes order-pulse {
      0%, 100% { text-shadow: 0 0 20px rgba(252,163,17,0.4); color: #FCA311; }
      50%       { text-shadow: 0 0 60px rgba(252,163,17,1), 0 0 120px rgba(252,163,17,0.6); color: #FFD070; }
    }

    .order-name--active {
      animation: order-arrive 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) both,
                 order-pulse 2s ease-in-out 0.3s infinite;
    }

    .clear-btn {
      margin-top: 2rem;
      padding: 0.75em 2.5em;
      font-family: inherit;
      font-size: clamp(0.8rem, 3vw, 1.1rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: transparent;
      border: 2px solid rgba(252,163,17,0.4);
      color: rgba(252,163,17,0.6);
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .clear-btn:active {
      border-color: rgba(252,163,17,1);
      color: rgba(252,163,17,1);
    }

    #maintenance-overlay {
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: #000F00;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }
    #maintenance-overlay[hidden] { display: none; }
    .maintenance-title {
      font-size: clamp(2rem, 10vw, 5rem);
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #7CC142;
      text-align: center;
    }
    .maintenance-sub {
      font-size: clamp(0.7rem, 2.5vw, 1rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(124,193,66,0.45);
    }
    .maintenance-reopen {
      font-size: clamp(0.85rem, 3vw, 1.25rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(124,193,66,0.7);
    }
    @keyframes maintenance-glitch-h {
      0%   { transform: translate(0,0) skewX(0); filter: none; opacity: 1; }
      7%   { transform: translate(-14px,0) skewX(-3deg); filter: drop-shadow(7px 0 0 rgba(255,0,128,0.9)) drop-shadow(-7px 0 0 rgba(0,220,255,0.9)); }
      16%  { transform: translate(11px,0) skewX(2.5deg); filter: drop-shadow(-6px 0 0 rgba(255,0,128,0.8)) drop-shadow(6px 0 0 rgba(0,220,255,0.8)); }
      24%  { transform: translate(0,0) skewX(0); filter: none; }
      57%  { opacity: 1; }
      61%  { opacity: 0; transform: translate(10px,0) skewX(-2deg); filter: drop-shadow(-6px 0 0 rgba(0,220,255,0.85)); }
      65%  { opacity: 1; transform: translate(0,0); filter: none; }
      69%  { opacity: 0; transform: translate(-6px,0); }
      73%  { opacity: 1; transform: translate(0,0); }
      100% { transform: translate(0,0) skewX(0); filter: none; opacity: 1; }
    }
    .maintenance-title.glitching { animation: maintenance-glitch-h 0.55s linear forwards; }
  </style>
</head>
<body>
  <div class="crt-overlay" aria-hidden="true"></div>
  <div class="cp-label">Collection Point <span id="cp-number">—</span></div>
  <div class="order-section" id="order-section">
    <div class="empty">No order assigned</div>
  </div>
  <div id="maintenance-overlay" hidden aria-live="assertive">
    <p class="maintenance-title">TERMINAL OFFLINE</p>
    <p class="maintenance-sub">FACILITY CLOSED — STAND BY</p>
    <p id="maintenance-reopen" class="maintenance-reopen" hidden></p>
  </div>
  <script src="/collection.js"></script>
</body>
</html>
