<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Control — Polybius Space Bar</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { padding: 1rem 1.25rem; }
    h1 { font-size: 1.2rem; color: #aaa; margin-bottom: 1rem; }

    .current {
      background: #1e1e1e;
      border-radius: 0.5rem;
      padding: 0.85rem 1.1rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: #aaa;
    }
    .current span {
      display: block;
      font-size: 1.1rem;
      font-weight: 700;
      color: #eee;
      margin-top: 0.2rem;
      min-height: 1.4rem;
    }

    /* Two-zone layout: side (controls) + main (presets) */
    .control-body {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .control-side {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.6rem;
    }

    /* Landscape: side-by-side */
    @media (orientation: landscape) and (min-width: 640px) {
      body {
        padding: 0.5rem 0.75rem;
        height: 100dvh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        width: 100%;
      }
      h1 { margin-bottom: 0.5rem; flex-shrink: 0; }

      #printer-alerts, #order-alert { flex-shrink: 0; }

      .control-body {
        flex: 1;
        min-height: 0;
        flex-direction: row;
        align-items: stretch;
        gap: 1rem;
      }
      .control-side {
        flex: 1;
        min-width: 0;
        order: 1;
        overflow: hidden;
      }
      .presets {
        flex: 2;
        min-width: 0;
        min-height: 0;
        order: 2;
        grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: minmax(0, 1fr);
        overflow: hidden;
      }
    }

    .preset {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 0.5rem;
      padding: 0.85rem 0.75rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: #eee;
      cursor: pointer;
      text-align: center;
      line-height: 1.3;
      transition: background 0.1s, border-color 0.1s;
    }
    .preset:active { background: #2a2a2a; border-color: #555; }
    .preset--active-lore  { border-color: #BE00FE; color: #BE00FE; }
    .preset--active-plain { border-color: #FCA311; color: #FCA311; }
    .preset--default { background: #0d2a00; border-color: #7CC142; color: #7CC142; }
    .preset--default.preset--active-lore { background: #0d2a00; border-color: #7CC142; color: #7CC142; }

    .preset-quote { color: #FCA311; font-style: italic; }
    .preset-plain-hint {
      display: block;
      font-size: 0.6rem;
      font-weight: 400;
      color: #555;
      letter-spacing: 0.04em;
      margin-top: 0.3rem;
      text-transform: none;
    }

    @media (orientation: landscape) and (min-width: 640px) {
      .preset {
        font-size: clamp(0.85rem, 4dvh, 2.8rem);
        padding: clamp(0.5rem, 3dvh, 3rem) clamp(0.4rem, 1.5vw, 1.5rem);
        line-height: 1.2;
      }
      .preset-plain-hint {
        font-size: clamp(0.5rem, 1.5dvh, 0.9rem);
        margin-top: 0.4em;
      }
    }

    .freetext {
      display: flex;
      gap: 0.6rem;
    }
    .freetext input {
      flex: 1;
      min-width: 0;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 0.5rem;
      padding: 0.65rem 0.9rem;
      color: #eee;
      font-size: 1rem;
    }
    .freetext input:focus { outline: none; border-color: #555; }

    .btn-send {
      background: #BE00FE;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      padding: 0.65rem 1.1rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-send:active { opacity: 0.85; }

    .btn-clear {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #555;
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 700;
      color: #aaa;
      cursor: pointer;
    }
    .btn-clear:active { background: #333; }

    /* Maintenance cards */
    .maintenance-card {
      border: 1px solid #333;
      border-radius: 0.5rem;
      overflow: hidden;
    }
    .maintenance-reopens {
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.9rem;
      border-bottom: 1px solid #2a2a2a;
    }
    .maintenance-reopens-label {
      font-size: 0.68rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .maintenance-reopens input[type="time"] {
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 0.9rem;
      font-weight: 600;
      color-scheme: dark;
      cursor: pointer;
      padding: 0;
      outline: none;
    }

    .btn-kiosk-maintenance + .btn-maintenance {
      border-top: 1px solid #222;
    }

    /* Kiosk-only maintenance (amber) */
    .btn-kiosk-maintenance {
      width: 100%;
      background: #1a1200;
      border: none;
      border-radius: 0;
      padding: 0.75rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: #887755;
      cursor: pointer;
    }
    .btn-kiosk-maintenance:active { background: #241800; }
    .btn-kiosk-maintenance--active {
      background: #2a1800;
      color: #ffaa33;
    }
    .btn-kiosk-maintenance:disabled {
      opacity: 1;
      cursor: default;
    }

    /* Full OMS maintenance (red) */
    .btn-maintenance {
      width: 100%;
      background: #1a0000;
      border: none;
      border-radius: 0;
      padding: 0.75rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: #886666;
      cursor: pointer;
    }
    .btn-maintenance:active { background: #2a0000; }
    .btn-maintenance--active {
      background: #3a0000;
      color: #ff4422;
    }

    @keyframes order-flash {
      0%, 100% { background: #0d0d0d; }
      50% { background: #003344; }
    }
    body.order-flash { animation: order-flash 0.25s ease-in-out 1; }

    #order-alert {
      background: #002233;
      border: 2px solid #00aacc;
      border-radius: 0.5rem;
      padding: 0.65rem 1.1rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }
    #order-alert[hidden] { display: none; }
    #order-alert.order-alert--soft-only {
      background: #001a00;
      border-color: #7CC142;
    }
    #order-alert.order-alert--soft-only .order-alert-label {
      color: #7CC142;
    }
    .order-alert-label {
      color: #00aacc;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    #order-alert-ref {
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      flex: 1;
    }
    #btn-id-reject {
      background: #3a0000;
      border: 1px solid #cc0000;
      border-radius: 0.4rem;
      padding: 0.3rem 0.65rem;
      color: #ff4444;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #btn-id-reject:active { background: #5a0000; }
    #order-alert.order-alert--soft-only #btn-id-reject { display: none; }

    #printer-alerts { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.75rem; }
    #printer-alerts:empty { display: none; }
    .printer-alert-banner {
      background: #2a0a00;
      border: 2px solid #cc4400;
      border-radius: 0.5rem;
      padding: 0.55rem 0.9rem;
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }
    .printer-alert-label { color: #ff6600; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; flex-shrink: 0; }
    .printer-alert-msg { color: #ffcc99; font-size: 0.9rem; flex: 1; }
    .btn-clear-alert {
      background: #3a1000;
      border: 1px solid #cc4400;
      border-radius: 0.35rem;
      padding: 0.25rem 0.55rem;
      color: #ff6600;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-clear-alert:active { background: #5a1800; }
  </style>
</head>
<body>
  <h1>B.A.R. Terminal Control</h1>

  <div id="printer-alerts"></div>

  <div id="order-alert" hidden>
    <span class="order-alert-label">Order loaded</span>
    <span id="order-alert-ref"></span>
    <button id="btn-id-reject">✗ Reject ID</button>
  </div>

  <div class="control-body">
    <!-- Presets (primary area) -->
    <div class="presets">
      <button class="preset preset--default" data-lore-msg="PAY HERE" data-plain-msg="PAY HERE">
        PAY HERE
      </button>
      <button class="preset" data-lore-msg="PRESENT 'EMPLOYEE' ID" data-plain-msg="PRESENT ID">
        PRESENT <span class="preset-quote">'EMPLOYEE'</span> ID
        <span class="preset-plain-hint">×2 → PRESENT ID</span>
      </button>
      <button class="preset" data-lore-msg="CREDENTIAL DENIED" data-plain-msg="REJECTED">
        CREDENTIAL DENIED
        <span class="preset-plain-hint">×2 → REJECTED</span>
      </button>
      <button class="preset" data-lore-msg="VERIFICATION APPROVED|TRANSACT BELOW" data-plain-msg="APPROVED|PAY BELOW">
        APPROVED<br>TRANSACT BELOW
        <span class="preset-plain-hint">×2 → APPROVED — PAY BELOW</span>
      </button>
      <button class="preset" data-lore-msg="CREDIT TRANSFER COMPLETE" data-plain-msg="PAYMENT PROCESSED">
        CREDIT TRANSFER COMPLETE
        <span class="preset-plain-hint">×2 → PAYMENT PROCESSED</span>
      </button>
      <button class="preset" data-lore-msg="STAND BY, WORKER" data-plain-msg="PLEASE WAIT">
        STAND BY, WORKER
        <span class="preset-plain-hint">×2 → PLEASE WAIT</span>
      </button>
      <button class="preset" data-lore-msg="NEXT WORKER" data-plain-msg="NEXT CUSTOMER">
        NEXT WORKER
        <span class="preset-plain-hint">×2 → NEXT CUSTOMER</span>
      </button>
    </div>

    <!-- Side controls -->
    <div class="control-side">
      <div class="current">
        Current message
        <span id="current-message">—</span>
      </div>

      <div class="freetext">
        <input id="custom-input" type="text" placeholder="Custom message…" maxlength="200" autocomplete="off">
        <button class="btn-send" id="btn-send">Send</button>
      </div>

      <button class="btn-clear" id="btn-clear">Clear display</button>

      <div class="maintenance-card">
        <div class="maintenance-reopens">
          <span class="maintenance-reopens-label">Reopening at</span>
          <input type="time" id="reopen-time" value="01:30">
        </div>
        <button class="btn-kiosk-maintenance" id="btn-kiosk-maintenance">Enable kiosk maintenance</button>
        <button class="btn-maintenance" id="btn-maintenance">Enable full maintenance</button>
      </div>
    </div>
  </div>

  <script src="/control.js"></script>
</body>
</html>
