<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Collection Scan — Space Bar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Eurostile', ui-sans-serif, system-ui, sans-serif;
      background: radial-gradient(ellipse 80% 70% at 50% 40%, #001a00 0%, #000F00 100%);
      color: #7CC142;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .crt-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.15) 3px, rgba(0,0,0,0.15) 4px
      );
    }

    /* Hidden input captures scanner keystrokes */
    #scan-input {
      position: fixed;
      opacity: 0;
      width: 1px;
      height: 1px;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .screen { text-align: center; }

    /* Idle state */
    .idle-prompt {
      font-size: clamp(1rem, 3vw, 1.8rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(124,193,66,0.25);
    }

    .idle-icon {
      font-size: clamp(3rem, 12vw, 7rem);
      color: rgba(124,193,66,0.1);
      margin-bottom: 1rem;
      line-height: 1;
    }

    /* Result state */
    .result-order-label {
      font-size: clamp(0.55rem, 1.6vw, 0.8rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(252,163,17,0.45);
      margin-bottom: 0.3em;
    }

    .result-order {
      font-size: clamp(2.5rem, 12vw, 6rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #FCA311;
      text-shadow: 0 0 32px rgba(252,163,17,0.4);
    }

    .result-label {
      font-size: clamp(1rem, 3.5vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(124,193,66,0.85);
      margin: 1.4rem 0 0.3rem;
    }

    .result-cp {
      font-size: clamp(4rem, 22vw, 10rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1;
      color: #7CC142;
      text-shadow: 0 0 60px rgba(124,193,66,0.5);
    }

    /* Error state */
    .error-msg {
      font-size: clamp(0.9rem, 3vw, 1.5rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(252,100,50,0.7);
    }

    /* Payment required state */
    .payment-required {
      font-size: clamp(1.2rem, 4vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #FCA311;
      text-shadow: 0 0 24px rgba(252,163,17,0.6);
      margin-top: 1.4rem;
    }

    .payment-required-sub {
      font-size: clamp(0.65rem, 2vw, 0.9rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(252,163,17,0.5);
      margin-top: 0.5em;
    }

    #maintenance-overlay {
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: #000F00;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }
    #maintenance-overlay[hidden] { display: none; }
    .maintenance-title {
      font-size: clamp(2rem, 10vw, 5rem);
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #7CC142;
      text-align: center;
    }
    .maintenance-sub {
      font-size: clamp(0.7rem, 2.5vw, 1rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(124,193,66,0.45);
    }
    .maintenance-reopen {
      font-size: clamp(0.85rem, 3vw, 1.25rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(124,193,66,0.7);
    }
    @keyframes maintenance-glitch-h {
      0%   { transform: translate(0,0) skewX(0); filter: none; opacity: 1; }
      7%   { transform: translate(-14px,0) skewX(-3deg); filter: drop-shadow(7px 0 0 rgba(255,0,128,0.9)) drop-shadow(-7px 0 0 rgba(0,220,255,0.9)); }
      16%  { transform: translate(11px,0) skewX(2.5deg); filter: drop-shadow(-6px 0 0 rgba(255,0,128,0.8)) drop-shadow(6px 0 0 rgba(0,220,255,0.8)); }
      24%  { transform: translate(0,0) skewX(0); filter: none; }
      57%  { opacity: 1; }
      61%  { opacity: 0; transform: translate(10px,0) skewX(-2deg); filter: drop-shadow(-6px 0 0 rgba(0,220,255,0.85)); }
      65%  { opacity: 1; transform: translate(0,0); filter: none; }
      69%  { opacity: 0; transform: translate(-6px,0); }
      73%  { opacity: 1; transform: translate(0,0); }
      100% { transform: translate(0,0) skewX(0); filter: none; opacity: 1; }
    }
    .maintenance-title.glitching { animation: maintenance-glitch-h 0.55s linear forwards; }
  </style>
</head>
<body>
  <div class="crt-overlay" aria-hidden="true"></div>
  <input id="scan-input" type="text" autocomplete="off" autocorrect="off" spellcheck="false" aria-hidden="true">
  <div class="screen" id="screen">
    <div class="idle-icon">▤</div>
    <div class="idle-prompt">Scan receipt</div>
  </div>
  <div id="maintenance-overlay" hidden aria-live="assertive">
    <p class="maintenance-title">TERMINAL OFFLINE</p>
    <p class="maintenance-sub">FACILITY CLOSED — STAND BY</p>
    <p id="maintenance-reopen" class="maintenance-reopen" hidden></p>
  </div>
  <script src="/scan.js"></script>
</body>
</html>
